<!DOCTYPE html>
<html>

<head>

<title>RCA Analysis Report</title>

<style>

body{
    font-family:Segoe UI;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#003366;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    width:95%;
    margin:auto;
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,.2);
}

.summary{
    background:#eef4ff;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#003366;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

tr:nth-child(even){
    background:#f9f9f9;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 15px;
    background:#28a745;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

</style>

</head>

<body>

<div class="header">

<h1>📊 RCA Analysis Report</h1>

</div>

<div class="container">

<div class="summary">

<b>Total RCA Records : {{ report_data|length }}</b>

</div>

<table>

<tr>
<th>Ticket No</th>
<th>Root Cause</th>
<th>Corrective Action</th>
<th>Preventive Action</th>
</tr>

{% for row in report_data %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>

</tr>

{% endfor %}

</table>

<a href="/reports" class="back-btn">

⬅ Back To Reports

</a>

</div>

</body>

</html>
