<!DOCTYPE html>
<html>

<head>

<title>Maintenance History</title>

<style>

body{
font-family:Segoe UI;
background:#f4f6f9;
margin:0;
}

.header{
background:#003366;
color:white;
padding:15px;
text-align:center;
}

.container{
width:95%;
margin:auto;
margin-top:20px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#003366;
color:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

</style>

</head>

<body>

<div class="header">

<h1>Maintenance History</h1>

</div>

<div class="container">

<table>

<tr>
<th>Ticket No</th>
<th>Machine</th>
<th>Problem</th>
<th>Technician</th>
<th>Downtime</th>
<th>Status</th>
</tr>

{% for row in history_data %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

<td>{{ row[3] }}</td>

<td>{{ row[4] }}</td>

<td>{{ row[5] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
