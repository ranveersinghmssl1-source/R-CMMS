<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>

    <style>

        body{
            font-family:Segoe UI,sans-serif;
            background:#f4f6f9;
            margin:0;
        }

        .header{
            background:linear-gradient(90deg,#003366,#0078d7);
            color:white;
            text-align:center;
            padding:20px;
        }

        .container{
            width:90%;
            max-width:800px;
            margin:30px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h2{
            color:#003366;
            margin-bottom:20px;
        }

        .row{
            display:flex;
            gap:20px;
            margin-bottom:15px;
        }

        .field{
            flex:1;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:5px;
        }

        input,
        select{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        .btn-save{
            background:#0078d7;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:5px;
            cursor:pointer;
        }

        .btn-save:hover{
            background:#005ea6;
        }

        .btn-back{
            background:#6c757d;
            color:white;
            text-decoration:none;
            padding:12px 25px;
            border-radius:5px;
            margin-left:10px;
        }

    </style>

</head>

<body>

<div class="header">
    <h1>MSSL User Management</h1>
</div>

<div class="container">

<h2>✏️ Edit User</h2>

<form action="/update_user/{{ user[0] }}" method="POST">

<div class="row">

    <div class="field">
        <label>Employee ID</label>
        <input type="text"
               name="employee_id"
               value="{{ user[1] }}"
               required>
    </div>

    <div class="field">
        <label>Employee Name</label>
        <input type="text"
               name="employee_name"
               value="{{ user[2] }}"
               required>
    </div>

</div>

<div class="row">

    <div class="field">
        <label>User Name</label>
        <input type="text"
               name="username"
               value="{{ user[3] }}"
               required>
    </div>

    <div class="field">
        <label>Email</label>
        <input type="email"
               name="email"
               value="{{ user[4] }}">
    </div>

</div>

<div class="row">

    <div class="field">
        <label>Department</label>

        <select name="department">
            <option {% if user[5]=='LPC' %}selected{% endif %}>LPC</option>
            <option {% if user[5]=='ASSY' %}selected{% endif %}>ASSY</option>
            <option {% if user[5]=='Maintenance' %}selected{% endif %}>Maintenance</option>
            <option {% if user[5]=='Admin' %}selected{% endif %}>Admin</option>
        </select>

    </div>

    <div class="field">
        <label>Role</label>

        <select name="role">
            <option {% if user[6]=='Admin' %}selected{% endif %}>Admin</option>
            <option {% if user[6]=='Supervisor' %}selected{% endif %}>Supervisor</option>
            <option {% if user[6]=='Maintenance' %}selected{% endif %}>Maintenance</option>
            <option {% if user[6]=='Technician' %}selected{% endif %}>Technician</option>
            <option {% if user[6]=='LPC Operator' %}selected{% endif %}>LPC Operator</option>
            <option {% if user[6]=='ASSY Operator' %}selected{% endif %}>ASSY Operator</option>
            <option {% if user[6]=='Store' %}selected{% endif %}>Store</option>
        </select>

    </div>

</div>

<div class="row">

    <div class="field">
        <label>Status</label>

        <select name="status">
            <option {% if user[7]=='ACTIVE' %}selected{% endif %}>ACTIVE</option>
            <option {% if user[7]=='INACTIVE' %}selected{% endif %}>INACTIVE</option>
        </select>

    </div>

</div>

<button type="submit" class="btn-save">
    ✅ Update User
</button>

<a href="/user_master" class="btn-back">
    ⬅ Back
</a>

</form>

</div>

</body>
</html>
