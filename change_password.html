<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>

        body{
            font-family:Segoe UI,sans-serif;
            background:#f4f6f9;
            margin:0;
        }

        .header{
            background:linear-gradient(90deg,#003366,#0078d7);
            color:white;
            text-align:center;
            padding:20px;
        }

        .container{
            width:500px;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            color:#003366;
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        .btn{
            background:#0078d7;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:5px;
            cursor:pointer;
            margin-top:20px;
        }

        .btn:hover{
            background:#005ea6;
        }

        .back-btn{
            background:#6c757d;
            color:white;
            text-decoration:none;
            padding:12px 20px;
            border-radius:5px;
            margin-left:10px;
        }

    </style>

</head>

<body>

<div class="header">
    <h1>MSSL User Management</h1>
</div>

<div class="container">

    <h2>🔑 Change Password</h2>

    <form action="/update_password/{{ user[0] }}" method="POST">

        <label>User Name</label>
        <input type="text"
               value="{{ user[3] }}"
               readonly>

        <label>New Password</label>
        <input type="password"
               name="new_password"
               required>

        <label>Confirm Password</label>
        <input type="password"
               name="confirm_password"
               required>

        <button type="submit" class="btn">
            Update Password
        </button>

        <a href="/user_master" class="back-btn">
            Back
        </a>

    </form>

</div>

</body>
</html>
