<!DOCTYPE html>
<html>

<head>

<title>Edit Problem Master</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f6f9;
}

.header{
background:linear-gradient(90deg,#003366,#0078d7);
color:white;
padding:18px;
text-align:center;
}

.container{
width:80%;
margin:auto;
margin-top:20px;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.info-card{
background:#eef6ff;
padding:12px;
border-left:5px solid #0078d7;
border-radius:5px;
margin-bottom:20px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:15px;
}

.field label{
display:block;
font-weight:bold;
margin-bottom:5px;
color:#003366;
}

input,
select,
textarea{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
font-size:14px;
}

textarea{
height:100px;
resize:none;
}

input:focus,
select:focus,
textarea:focus{
outline:none;
border-color:#0078d7;
box-shadow:0 0 5px rgba(0,120,215,0.3);
}

.button-area{
text-align:center;
margin-top:20px;
}

.update-btn{
background:#28a745;
color:white;
border:none;
padding:12px 25px;
border-radius:5px;
cursor:pointer;
font-size:15px;
}

.update-btn:hover{
background:#218838;
}

.back-btn{
background:#6c757d;
color:white;
padding:12px 25px;
text-decoration:none;
border-radius:5px;
margin-left:10px;
}

.back-btn:hover{
background:#545b62;
}

</style>

</head>

<body>

<div class="header">
<h1>✏️ Edit Problem Master</h1>
</div>

<div class="container">

<div class="info-card">
Modify Existing Problem Information
</div>

<form action="/update_problem" method="POST">

<div class="row">

<div class="field">
<label>Problem Code</label>

<input
type="text"
name="problem_code"
value="{{ problem_data[0] }}"
readonly>

</div>

<div class="field">
<label>Problem Name</label>

<input
type="text"
name="problem_name"
value="{{ problem_data[1] }}">

</div>

</div>

<div class="row">

<div class="field">

<label>Department</label>

<select name="department">

<option value="LPC">LPC</option>
<option value="ASSY">ASSY</option>

</select>

</div>

<div class="field">

<label>Category</label>

<select name="category">

<option>Mechanical</option>
<option>Electrical</option>
<option>Pneumatic</option>
<option>Sensor</option>
<option>Software</option>

</select>

</div>

</div>

<div class="row">

<div class="field">

<label>Priority</label>

<select name="priority">

<option>Low</option>
<option>Medium</option>
<option>High</option>
<option>Critical</option>

</select>

</div>

<div class="field">

<label>Status</label>

<select name="status">

<option>ACTIVE</option>
<option>INACTIVE</option>

</select>

</div>

</div>

<div class="field">

<label>Description</label>

<textarea
name="description">{{ problem_data[5] }}</textarea>

</div>

<div class="button-area">

<button type="submit" class="update-btn">

✅ Update Problem

</button>

<a href="/problem_master" class="back-btn">

⬅ Back

</a>

</div>

</form>

</div>

</body>

</html>
