<!DOCTYPE html>
<html>
<head>
<title>MSSL Maintenance Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(
    135deg,
    #003366,
    #005ea6,
    #0078d7
    );

    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* Background Watermark */

.watermark{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:90px;
    font-weight:bold;
    color:rgba(255,255,255,0.08);
    white-space:nowrap;
    pointer-events:none;
    z-index:0;
}

/* Login Box */

.login-container{

    width:420px;

    background:linear-gradient(
    145deg,
    #ffffff,
    #f2f8ff
    );

    padding:35px;

    border-radius:20px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.35);

    border-top:6px solid #0078d7;

    position:relative;
    z-index:1;
}

/* Logo */

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    font-size:60px;
    margin-bottom:10px;
}

.logo h1{
    color:#003366;
    font-size:38px;
    font-weight:bold;
    letter-spacing:2px;
}

.logo p{
    color:#666;
    font-size:14px;
}

/* Labels */

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    color:#003366;
    font-weight:bold;
}

/* Inputs */

input{

    width:100%;
    padding:12px;

    border:2px solid #d0d0d0;

    border-radius:8px;

    font-size:15px;

    transition:0.3s;
}

input:focus{

    outline:none;

    border-color:#0078d7;

    box-shadow:
    0 0 10px rgba(0,120,215,0.35);

}

/* Login Button */

button{

    width:100%;

    margin-top:25px;

    padding:12px;

    background:linear-gradient(
    90deg,
    #0078d7,
    #00a2ff
    );

    border:none;

    border-radius:8px;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    background:linear-gradient(
    90deg,
    #005ea6,
    #0078d7
    );

    transform:scale(1.03);

}

/* Footer */

.footer{

    margin-top:20px;

    text-align:center;

    font-size:12px;

    color:#666;

    line-height:20px;
}

.system-tag{

    margin-top:10px;

    background:#eef6ff;

    padding:10px;

    border-left:4px solid #0078d7;

    border-radius:5px;

    text-align:center;

    color:#003366;

    font-size:13px;
}

</style>

</head>

<body>

<!-- Watermark -->

<div class="watermark">
Ranveer Singh
</div>

<!-- Login Box -->

<div class="login-container">

<div class="logo">

<div class="logo-icon">
🔧
</div>

<h1>MSSL</h1>

<p>
Maintenance Management System
</p>

</div>

<form action="/login" method="POST">

<label>User Name</label>

<input
type="text"
name="username"
placeholder="Enter User Name"
required>

<label>Password</label>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

<button type="submit">
🔐 LOGIN
</button>

</form>

<div class="system-tag">

LPC • ASSY • Maintenance • Inventory

</div>

<div class="footer">

MSSL Maintenance Management System

<br>

Version 1.0

</div>

</div>

</body>
</html>
