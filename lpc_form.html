<!DOCTYPE html>
<html>
<head>
    <title>LPC Breakdown Entry</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:0;
        }

        .header{
            background:#003366;
            color:white;
            padding:15px;
            text-align:center;
        }

        .container{
            width:80%;
            margin:auto;
            margin-top:20px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            color:#003366;
        }

        .row{
            display:flex;
            gap:20px;
            margin-bottom:15px;
        }

        .field{
            flex:1;
        }

        label{
            font-weight:bold;
            display:block;
            margin-bottom:5px;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        textarea{
            height:100px;
        }

        .submit-btn{
            background:#0078d7;
            color:white;
            border:none;
            padding:12px 25px;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
        }

        .submit-btn:hover{
            background:#005ea6;
        }

        .status-open{
            background:red;
            color:white;
            padding:8px 15px;
            border-radius:5px;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="header">
    <h1>MSSL LPC Breakdown Entry System</h1>
</div>

<div class="container">

<h2>Breakdown Ticket Entry</h2>

<p>
Status :
<input
type="hidden"
name="status"
value="OPEN">
</span>
</p>

<form action="/save_lpc" method="POST">

<div class="row">

<div class="field">
<label>Ticket No</label>
<input
type="text"
name="ticket_no"
value="LPC001">
</div>

<div class="field">
<label>Date</label>
<input
type="date"
name="breakdown_date"
id="breakdown_date"
readonly>
</div>

</div>

<div class="row">

<div class="field">
<label>Shift</label>

<input
type="text"
name="shift_name"
id="shift_name"
readonly>

</div>

<div class="field">
<label>Operator Name</label>
<input type="text"
 name="operator_name">
</div>

</div>

<div class="row">

<div class="field">
<label>Employee ID</label>
<input type="text"
 name="employee_id">
</div>

<div class="field">
<label>Line Name</label>
<input type="text"
 name="line_name">
</div>

</div>

<div class="row">

<div class="field">
<label>Machine</label>

<select name="machine_name">

<option>C&C-01</option>
<option>MCR-01</option>
<option>USW-01</option>
<option>KAPPA-01</option>
<option>Cable Cutting-01</option>

</select>

</div>

<div class="field">
<label>Breakdown Time</label>
<input
type="time"
name="breakdown_time"
id="breakdown_time"
readonly>
</div>

</div>

<div class="row">

<div class="field">
<label>Applicator No</label>
<input type="text"
 name="applicator_no">
</div>
    
<div class="field">
<label>Terminal Part No</label>
<input type="text" name="terminal_part_no">
</div>

</div>

<div class="row">

<div class="field">
<label>Problem Type</label>

<select name="problem_type">

<option>Applicator Damage</option>
<option>Terminal Jam</option>
<option>Wire Jam</option>
<option>Sensor Fault</option>
<option>Crimp NG</option>

</select>

</div>

<div class="field">
<label>Priority</label>

<select name="priority">

<option>Low</option>
<option>Medium</option>
<option>High</option>
<option>Critical</option>

</select>

</div>

</div>

<label>Description</label>

<textarea name="description"
placeholder="Enter Breakdown Description">
</textarea>

<br><br>

<button class="submit-btn" type="submit">
Submit Breakdown
</button>

</form>

</div>
<script>

window.onload = function(){

    let now = new Date();

    // Date

    let year = now.getFullYear();

    let month = String(
        now.getMonth() + 1
    ).padStart(2,'0');

    let day = String(
        now.getDate()
    ).padStart(2,'0');

    document.getElementById(
        "breakdown_date"
    ).value =
    year + "-" + month + "-" + day;

    // Time

    let hour = String(
        now.getHours()
    ).padStart(2,'0');

    let minute = String(
        now.getMinutes()
    ).padStart(2,'0');

    document.getElementById(
        "breakdown_time"
    ).value =
    hour + ":" + minute;


    // Shift Auto

    let currentHour =
    now.getHours();

    let shift = "";

    if(
        currentHour >= 6 &&
        currentHour < 14
    ){
        shift = "A SHIFT";
    }
    else if(
        currentHour >= 14 &&
        currentHour < 22
    ){
        shift = "B SHIFT";
    }
    else{
        shift = "C SHIFT";
    }

    document.getElementById(
        "shift_name"
    ).value = shift;

};

</script>
</body>
</html>
