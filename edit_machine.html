<!DOCTYPE html>
<html>

<head>

<title>Edit Machine Master</title>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:linear-gradient(90deg,#003366,#0078d7);
    color:white;
    text-align:center;
    padding:18px;
}

.container{
    width:70%;
    margin:20px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.info-card{
    background:#eef6ff;
    padding:12px;
    border-left:5px solid #0078d7;
    margin-bottom:20px;
    border-radius:5px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:15px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
    color:#003366;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#0078d7;
}

.button-area{
    text-align:center;
    margin-top:20px;
}

.update-btn{
    background:#28a745;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
    font-size:15px;
}

.update-btn:hover{
    background:#218838;
}

.back-btn{
    background:#6c757d;
    color:white;
    padding:12px 25px;
    text-decoration:none;
    border-radius:5px;
    margin-left:10px;
}

.back-btn:hover{
    background:#545b62;
}

</style>

</head>

<body>

<div class="header">

<h1>✏️ Edit Machine Master</h1>

</div>

<div class="container">

<div class="info-card">

Update Machine Information

</div>

<form action="/update_machine" method="POST">

<div class="row">

<div class="field">

<label>Machine Code</label>

<input
type="text"
name="machine_code"
value="{{ machine_data[0] }}"
readonly>

</div>

<div class="field">

<label>Machine Name</label>

<input
type="text"
name="machine_name"
value="{{ machine_data[1] }}">

</div>

</div>

<div class="row">

<div class="field">

<label>Department</label>

<input
type="text"
name="department"
value="{{ machine_data[2] }}">

</div>

<div class="field">

<label>Line Name</label>

<input
type="text"
name="line_name"
value="{{ machine_data[3] }}">

</div>

</div>

<div class="row">

<div class="field">

<label>Machine Type</label>

<input
type="text"
name="machine_type"
value="{{ machine_data[4] }}">

</div>

<div class="field">

<label>Make Name</label>

<input
type="text"
name="make_name"
value="{{ machine_data[5] }}">

</div>

</div>

<div class="row">

<div class="field">

<label>Status</label>

<select name="status">

<option value="RUNNING">RUNNING</option>

<option value="BREAKDOWN">BREAKDOWN</option>

<option value="IDLE">IDLE</option>

</select>

</div>

</div>

<div class="button-area">

<button type="submit" class="update-btn">

✅ Update Machine

</button>

<a href="/machine_master" class="back-btn">

⬅ Back

</a>

</div>

</form>

</div>

</body>

</html>
