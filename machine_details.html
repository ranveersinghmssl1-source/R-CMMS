<!DOCTYPE html>
<html>

<head>

<title>Machine Breakdown History</title>

<style>

body{
font-family:Segoe UI;
background:#f4f6f9;
margin:0;
}

.header{
background:#003366;
color:white;
padding:15px;
text-align:center;
}

.container{
width:95%;
margin:auto;
margin-top:20px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,.2);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#003366;
color:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

.back-btn{
display:inline-block;
margin-top:20px;
padding:10px 15px;
background:#28a745;
color:white;
text-decoration:none;
border-radius:5px;
}

</style>

</head>

<body>

<div class="header">

<h1>🔧 {{ machine_name }} Breakdown History</h1>

</div>

<div class="container">

<table>

<tr>

<th>Ticket No</th>
<th>Date</th>
<th>Problem</th>
<th>Status</th>

</tr>

{% for row in report_data %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>

</tr>

{% endfor %}

</table>

<a href="/machine_wise_report" class="back-btn">

⬅ Back To Machine Report

</a>

</div>

</body>

</html>
